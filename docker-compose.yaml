services:
  qdrant:
    # passend zu qdrant-client >=1.19,<1.21 (requirements.txt): der Client
    # verlangt dieselbe Hauptversion und höchstens eine Minor-Version Abstand
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"    # REST API, nur lokal (Qdrant läuft ohne Zugangsschutz)
      - "127.0.0.1:6334:6334"    # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  # Eigenes Volume für Qdrant 1.19: Bestände älterer Qdrant-Versionen nicht
  # einhängen, Qdrant kann beim Upgrade keine Minor-Versionen überspringen.
  qdrant_storage:
